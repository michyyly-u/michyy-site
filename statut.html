<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Statut — Michyy</title>
<meta name="description" content="Statut en direct : en ligne/hors ligne, délai de réponse estimé, dernière vidéo livrée." />
<meta name="robots" content="noindex" />
<!--
  🔧 PAGE DE MAINTENANCE — statut.html
  Page publique autonome, pensée pour un lien en bio (Discord/X/TikTok) qui va droit à l'essentiel
  plutôt que de renvoyer vers toute la page d'accueil.

  Duplique volontairement 2 réglages du fichier principal (index.html) : si tu changes l'un des
  deux là-bas, pense à le changer ici aussi (recherché par les constantes ACTIVE_START / ACTIVE_END
  / AFFLUENCE_LEVEL, identiques aux deux endroits) :
    - Heures actives (ACTIVE_START / ACTIVE_END, ligne ~40 ci-dessous)
    - Niveau d'affluence affiché (AFFLUENCE_LEVEL, ligne ~45 ci-dessous)

  "Dernière vidéo livrée" nécessite l'action "publicRecentDeliveries" côté Apps Script (voir le
  fichier .gs) — si elle n'est pas encore branchée, cette ligne reste simplement masquée, aucune
  erreur visible pour le visiteur.
-->
<style>
  * , *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #0b0b0d;
    color: #f2f2f2;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #16161a;
    border: 1px solid #2a2a30;
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
  }
  .card h1 {
    font-size: 1.1rem;
    font-weight: 600;
    color: #9a9aa5;
    margin-bottom: 20px;
    letter-spacing: 0.02em;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 1.05rem;
    background: rgba(139, 226, 139, 0.12);
    color: #8be28b;
    margin-bottom: 18px;
  }
  .badge.is-offline {
    background: rgba(226, 178, 139, 0.12);
    color: #e2b28b;
  }
  .badge .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 0 0 currentColor;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(139, 226, 139, 0.5); }
    70% { box-shadow: 0 0 0 8px rgba(139, 226, 139, 0); }
    100% { box-shadow: 0 0 0 0 rgba(139, 226, 139, 0); }
  }
  .delay {
    font-size: 0.95rem;
    color: #c7c7cf;
    margin-bottom: 6px;
  }
  .affluence {
    font-size: 0.85rem;
    color: #8a8a93;
    margin-bottom: 22px;
  }
  .delivery {
    font-size: 0.85rem;
    color: #8a8a93;
    border-top: 1px solid #2a2a30;
    padding-top: 16px;
    margin-top: 4px;
    display: none;
  }
  .back {
    display: inline-block;
    margin-top: 22px;
    font-size: 0.85rem;
    color: #ff8a3d;
    text-decoration: none;
  }
  .back:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>MICHYY · STATUT EN DIRECT</h1>
    <div class="badge" id="statusBadge">
      <span class="dot"></span>
      <span id="statusBadgeText">…</span>
    </div>
    <p class="delay" id="delayText"></p>
    <p class="affluence" id="affluenceText"></p>
    <p class="delivery" id="deliveryText"></p>
    <a class="back" href="/">← Retour au site</a>
  </div>

  <script>
    // 🔧 Doit rester identique aux constantes du même nom dans index.html (voir commentaire en haut
    // de ce fichier).
    const ACTIVE_START = 9;
    const ACTIVE_END = 23;
    const AFFLUENCE_LEVEL = 'moderate';
    const AFFLUENCE_CONFIG = {
      low: { text: 'Affluence faible, places disponibles' },
      moderate: { text: 'Affluence modérée cette semaine' },
      high: { text: 'Affluence élevée, délais un peu plus longs' }
    };
    const affluenceConf = AFFLUENCE_CONFIG[AFFLUENCE_LEVEL] || AFFLUENCE_CONFIG.moderate;

    function isCurrentlyActive(hour = new Date().getHours()) {
      return hour >= ACTIVE_START && hour < ACTIVE_END;
    }

    function render() {
      const hour = new Date().getHours();
      const active = isCurrentlyActive(hour);

      const badge = document.getElementById('statusBadge');
      const badgeText = document.getElementById('statusBadgeText');
      badge.classList.toggle('is-offline', !active);
      badgeText.textContent = active ? 'En ligne' : 'Hors ligne';

      const delayEl = document.getElementById('delayText');
      if (active) {
        delayEl.textContent = '🕐 Réponse sous quelques heures';
      } else {
        const hoursUntilActive = (ACTIVE_START - hour + 24) % 24 || 24;
        delayEl.textContent = `🌙 Réponse estimée sous ${hoursUntilActive}h`;
      }

      document.getElementById('affluenceText').textContent = affluenceConf.text;
    }
    render();
    setInterval(render, 5 * 60 * 1000);

    // --- Dernière vidéo livrée (optionnel, nécessite l'action "publicRecentDeliveries" côté
    // Apps Script) : reste masqué tant que l'action n'est pas branchée, jamais d'erreur visible. ---
    function formatRelative(timestamp) {
      const diffMs = Date.now() - timestamp;
      const days = Math.floor(diffMs / (24 * 60 * 60 * 1000));
      if (days <= 0) return "aujourd'hui";
      if (days === 1) return 'hier';
      if (days < 7) return `il y a ${days} jours`;
      const weeks = Math.floor(days / 7);
      if (weeks === 1) return 'il y a 1 semaine';
      return `il y a ${weeks} semaines`;
    }

    fetch(`/api/sheets-proxy?action=publicRecentDeliveries&_ts=${Date.now()}`)
      .then(res => res.json())
      .then(data => {
        if (!data || !data.success || !Array.isArray(data.deliveries) || !data.deliveries.length) return;
        const mostRecent = data.deliveries
          .map(d => new Date(d).getTime())
          .filter(t => !isNaN(t))
          .sort((a, b) => b - a)[0];
        if (!mostRecent) return;
        const el = document.getElementById('deliveryText');
        el.textContent = `📦 Dernière vidéo livrée ${formatRelative(mostRecent)}`;
        el.style.display = 'block';
      })
      .catch(() => { /* action pas encore ajoutée côté script, ou hors ligne — reste masqué */ });
  </script>
</body>
</html>
